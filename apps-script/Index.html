<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Minigames</title>
<style>
  :root { --bg1: #1b1240; --bg2: #071a2e; --text: #f1f0ff; --muted: #a3a8d0; --accent: #ffd166; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100%;
    background: radial-gradient(120% 80% at 50% 0%, var(--bg1), var(--bg2) 70%) fixed, var(--bg2);
    color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { width: min(480px, 100%); margin: 0 auto; padding: 24px 16px 40px; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 28px; font-weight: 900; letter-spacing: .5px; }
  .muted { color: var(--muted); font-size: 13px; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.2);
    background: rgba(0,0,0,.25); color: var(--text); font: inherit; font-size: 15px;
  }
  .games { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .game {
    display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 16px; text-decoration: none; color: inherit;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
  }
  .game:hover { background: rgba(255,255,255,.1); }
  .game b { font-size: 16px; }
  .thumb { display: grid; gap: 2px; aspect-ratio: 2 / 1; }
  .thumb i { border-radius: 3px; }
  .t-deslize { grid-template-columns: repeat(8, 1fr); }
  .t-coroas { grid-template-columns: repeat(5, 1fr); gap: 0; border-radius: 6px; overflow: hidden; aspect-ratio: 2 / 1; }
  .t-coroas i { border-radius: 0; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 .5px rgba(18,16,31,.3); }
  .t-coroas svg { width: 60%; height: 60%; color: #1c1830; }
  .y { background: #f2b632; } .p { background: #e94f7c; } .g { background: #2fbf5f; } .b { background: #3a7bff; }
  .cy { background: #f6c453; } .cp { background: #f08aa6; } .cg { background: #6fd08c; } .cb { background: #6aa8ff; } .cv { background: #b79bff; }

  section h2 { font-size: 15px; margin-bottom: 8px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .tab {
    appearance: none; border: 1px solid rgba(255,255,255,.15); background: transparent; color: var(--muted);
    font: inherit; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 99px; cursor: pointer;
  }
  .tab[aria-selected="true"] { background: var(--accent); color: #2a1a00; border-color: transparent; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { padding: 7px 6px; text-align: left; border-bottom: 1px solid rgba(255,255,255,.08); }
  th { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  th.n { text-align: right; }
  td:first-child { color: var(--accent); font-weight: 800; width: 28px; }
</style>
</head>
<body>
<main>
  <div>
    <h1>Minigames</h1>
    <p class="muted">Escolha um jogo. Pontuações ficam salvas na planilha.</p>
  </div>

  <div>
    <label for="nome">Seu nome</label>
    <input id="nome" maxlength="40" placeholder="Como você quer aparecer no ranking">
  </div>

  <div class="games">
    <a class="game" href="<?= baseUrl ?>?jogo=deslize" target="_top">
      <div class="thumb t-deslize">
        <i class="b" style="grid-column:1/5"></i><i></i><i class="p"></i><i class="g" style="grid-column:7/9"></i>
        <i></i><i class="y" style="grid-column:2/5"></i><i class="g" style="grid-column:5/7"></i><i></i><i class="p"></i>
        <i class="y" style="grid-column:1/3"></i><i class="p"></i><i></i><i class="b" style="grid-column:5/8"></i><i class="y"></i>
        <i class="y" style="grid-column:1/4"></i><i class="g"></i><i class="y" style="grid-column:5/9"></i>
      </div>
      <b>Deslize</b>
      <span class="muted">Arraste blocos e complete linhas</span>
    </a>
    <a class="game" href="<?= baseUrl ?>?jogo=coroas" target="_top">
      <div class="thumb t-coroas" id="thumbCoroas"></div>
      <b>Coroas</b>
      <span class="muted">Uma coroa por linha, coluna e cor</span>
    </a>
  </div>

  <section>
    <h2>Ranking</h2>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-jogo="deslize" aria-selected="true">Deslize</button>
      <button class="tab" role="tab" data-jogo="coroas" aria-selected="false">Coroas</button>
    </div>
    <table>
      <thead><tr><th>#</th><th>Jogador</th><th class="n">Fase</th><th class="n">Pontos</th></tr></thead>
      <tbody id="rank"><tr><td></td><td class="muted" colspan="3">Carregando…</td></tr></tbody>
    </table>
  </section>
</main>

<script>
  const NAME_KEY = 'mg_nome';
  const nome = document.getElementById('nome');
  try { nome.value = JSON.parse(localStorage.getItem(NAME_KEY) || '""'); } catch (e) {}
  nome.addEventListener('input', () => {
    try { localStorage.setItem(NAME_KEY, JSON.stringify(nome.value.trim())); } catch (e) {}
  });

  // miniatura do Coroas: 2 linhas x 5 colunas de regiões
  const CROWN = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M2.5 7.5l5 4 4.5-7 4.5 7 5-4-2 10.5h-15zM4.5 19.5h15V22h-15z"/></svg>';
  const cells = [['cv', 'cv', 'cb', 'cb', 'cg'], ['cy', 'cp', 'cp', 'cb', 'cg']];
  const crowns = { '0,1': 1, '1,3': 1 };
  document.getElementById('thumbCoroas').innerHTML = cells.map((row, r) =>
    row.map((k, c) => '<i class="' + k + '">' + (crowns[r + ',' + c] ? CROWN : '') + '</i>').join('')).join('');

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rankEl = document.getElementById('rank');
  const cache = {};

  function showRank(rows) {
    if (!rows.length) { rankEl.innerHTML = '<tr><td></td><td class="muted" colspan="3">Ninguém jogou ainda.</td></tr>'; return; }
    rankEl.innerHTML = rows.map((r, i) =>
      '<tr><td>' + (i + 1) + '</td><td>' + esc(r.nome) + '</td><td class="n">' + r.fase + '</td><td class="n">' + r.pontos.toLocaleString('pt-BR') + '</td></tr>'
    ).join('');
  }

  function loadRank(jogo) {
    document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.jogo === jogo)));
    if (cache[jogo]) { showRank(cache[jogo]); return; }
    rankEl.innerHTML = '<tr><td></td><td class="muted" colspan="3">Carregando…</td></tr>';
    google.script.run
      .withSuccessHandler((rows) => { cache[jogo] = rows; if (current === jogo) showRank(rows); })
      .withFailureHandler((err) => {
        rankEl.innerHTML = '<tr><td></td><td class="muted" colspan="3">Erro: ' + esc(err.message || err) + '</td></tr>';
      })
      .getTop(jogo, 10);
  }

  let current = 'deslize';
  document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => { current = t.dataset.jogo; loadRank(current); }));
  loadRank(current);
</script>
</body>
</html>
