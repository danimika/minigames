<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Deslize</title>
<style>
  :root {
    --bg1: #1b1240; --bg2: #071a2e;
    --text: #f1f0ff; --muted: #a3a8d0; --accent: #ffd166; --danger: #ff4d6d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(120% 80% at 50% 0%, var(--bg1), var(--bg2) 70%) fixed, var(--bg2);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    --w: min(94vw, 420px, calc((100vh - 220px) * 0.8));
    width: var(--w);
    margin: 0 auto;
    padding: 12px 0 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  @supports (height: 100svh) { #app { --w: min(94vw, 420px, calc((100svh - 220px) * 0.8)); } }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .title { font-weight: 800; letter-spacing: .5px; font-size: 18px; }
  .btn {
    appearance: none; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.08);
    color: var(--text); font: inherit; font-size: 13px; font-weight: 600;
    padding: 7px 12px; border-radius: 10px; cursor: pointer; text-decoration: none;
  }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); color: #2a1a00; border-color: transparent; }
  .btn[disabled] { opacity: .5; pointer-events: none; }

  .hud { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 8px; }
  .stat {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px; padding: 6px 8px; text-align: center;
  }
  .stat .lbl { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .stat .val { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat.main .val { color: var(--accent); font-size: 22px; }

  .progress { position: relative; height: 16px; border-radius: 99px; background: rgba(255,255,255,.07); overflow: hidden; }
  #progFill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #7b5cff, #20b2a6); transition: width .35s ease; }
  #progTxt { position: relative; display: block; text-align: center; font-size: 10px; line-height: 16px; font-weight: 700; letter-spacing: .5px; }

  #board {
    --cell: calc(var(--w) / 8);
    position: relative; width: var(--w); height: calc(var(--w) * 1.25);
    border-radius: 14px; overflow: hidden; touch-action: none;
    background-color: rgba(4, 8, 24, .55);
    background-image:
      linear-gradient(to right, rgba(255,255,255,.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.055) 1px, transparent 1px);
    background-size: var(--cell) var(--cell);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), 0 10px 30px rgba(0,0,0,.4);
    transition: box-shadow .3s;
  }
  #board.danger { box-shadow: inset 0 0 0 2px var(--danger), 0 0 24px rgba(255,77,109,.35); }
  #board.danger::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: calc(var(--cell) * 2);
    background: linear-gradient(rgba(255,77,109,.18), transparent); pointer-events: none;
  }
  #board.noanim .blk { transition: none !important; }

  #lane {
    position: absolute; top: 0; bottom: 0; display: none; pointer-events: none;
    left: calc(var(--cell) * var(--c)); width: calc(var(--cell) * var(--w));
    background: linear-gradient(rgba(255,255,255,.13), rgba(255,255,255,.04));
    border-left: 1px solid rgba(255,255,255,.18); border-right: 1px solid rgba(255,255,255,.18);
  }

  .blk {
    position: absolute; z-index: 2;
    left: calc(var(--cell) * var(--c)); top: calc(var(--cell) * var(--r));
    width: calc(var(--cell) * var(--w)); height: var(--cell);
    padding: 3px; cursor: grab; touch-action: none;
    transition: top .2s cubic-bezier(.5, 0, .9, .6), left .15s ease, transform .15s ease;
  }
  .blk .in {
    position: relative; width: 100%; height: 100%; border-radius: 9px; overflow: hidden;
    background: linear-gradient(180deg, var(--hi), var(--base) 60%, var(--lo));
    box-shadow: inset 0 2px 0 rgba(255,255,255,.5), inset 0 -4px 0 rgba(0,0,0,.25), 0 3px 6px rgba(0,0,0,.4);
  }
  /* uma "gema" por célula */
  .blk .in::before {
    content: ""; position: absolute; inset: -3px;
    background: radial-gradient(circle at 50% 48%, rgba(255,255,255,.55) 0 9%, rgba(255,255,255,.12) 10% 22%, transparent 23%);
    background-size: var(--cell) var(--cell);
  }
  .blk .in::after {
    content: ""; position: absolute; left: 6%; right: 6%; top: 8%; height: 28%;
    border-radius: 99px; background: rgba(255,255,255,.18);
  }
  /* cores (aleatórias, independentes do tamanho) */
  .k0 { --base: #f2b632; --hi: #ffe69a; --lo: #b57b12; } /* amarelo */
  .k1 { --base: #e94f7c; --hi: #ff9cbb; --lo: #b02a55; } /* rosa */
  .k2 { --base: #2fbf5f; --hi: #8ff0a8; --lo: #1a8240; } /* verde */
  .k3 { --base: #3a7bff; --hi: #9cbcff; --lo: #2150c4; } /* azul */

  .blk.dragging { transition: none; z-index: 5; cursor: grabbing; }
  .blk.dragging .in { filter: brightness(1.15); box-shadow: inset 0 2px 0 rgba(255,255,255,.5), inset 0 -4px 0 rgba(0,0,0,.25), 0 6px 14px rgba(0,0,0,.55); }
  .blk.clearing .in { animation: clear .3s ease-in forwards; }
  @keyframes clear {
    0% { filter: brightness(1); }
    35% { filter: brightness(2.3); transform: scale(1.06); }
    100% { filter: brightness(2.5); transform: scale(.2); opacity: 0; }
  }
  .blk.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  #fx { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
  .pop {
    position: absolute; text-align: center; white-space: nowrap;
    font-weight: 900; font-size: calc(var(--cell) * .5); color: #fff;
    text-shadow: 0 2px 0 rgba(0,0,0,.4), 0 0 12px rgba(255,209,102,.8);
    animation: floatUp .9s ease-out forwards;
  }
  @keyframes floatUp { from { transform: translateY(0); opacity: 1; } to { transform: translateY(calc(var(--cell) * -1.2)); opacity: 0; } }
  .banner {
    position: absolute; left: 0; right: 0; top: 38%; text-align: center;
    font-weight: 900; font-size: calc(var(--cell) * .75); color: var(--accent); letter-spacing: 1px; padding: 0 8px;
    text-shadow: 0 3px 0 #7a4a00, 0 0 20px rgba(255,209,102,.6);
    animation: bannerIn 1.1s ease-out forwards;
  }
  @keyframes bannerIn {
    0% { transform: scale(.4); opacity: 0; } 20% { transform: scale(1.1); opacity: 1; }
    35% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-20px); }
  }

  #next { position: relative; height: 10px; margin-top: -4px; }
  #next .bar {
    position: absolute; top: 0; height: 8px; border-radius: 99px;
    background: linear-gradient(180deg, var(--hi), var(--base));
    opacity: .75; transition: opacity .2s;
  }
  .hint { text-align: center; font-size: 12px; color: var(--muted); }

  #overlay {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    background: rgba(5, 6, 20, .7); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    padding: 16px;
  }
  #overlay.hidden { display: none; }
  .card {
    width: min(340px, 100%); background: linear-gradient(180deg, #2a2160, #17143a);
    border: 1px solid rgba(255,255,255,.15); border-radius: 18px; padding: 20px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .card h2 { font-size: 24px; margin-bottom: 6px; }
  .card .big { font-size: 40px; font-weight: 900; color: var(--accent); font-variant-numeric: tabular-nums; }
  .card .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .card .newbest { color: #79f2e0; font-weight: 800; font-size: 13px; margin-bottom: 8px; }
  .card input {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.2);
    background: rgba(0,0,0,.25); color: var(--text); font: inherit; font-size: 15px; margin-bottom: 8px;
    -webkit-user-select: text; user-select: text;
  }
  .card .row { display: flex; gap: 8px; justify-content: center; margin-top: 6px; }
  .card .row .btn { flex: 1; padding: 10px; font-size: 14px; }
  #saveStatus { min-height: 18px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <a class="btn" id="btnMenu" href="#" target="_top" style="visibility:hidden">‹ Menu</a>
    <div class="title">DESLIZE</div>
    <button class="btn" id="btnRestart">Reiniciar</button>
  </div>

  <div class="hud">
    <div class="stat"><span class="lbl">Fase</span><span class="val" id="level">1</span></div>
    <div class="stat main"><span class="lbl">Pontos</span><span class="val" id="score">0</span></div>
    <div class="stat"><span class="lbl">Recorde</span><span class="val" id="best">0</span></div>
  </div>

  <div class="progress"><div id="progFill"></div><span id="progTxt">0 / 8 linhas</span></div>

  <div id="board">
    <div id="lane"></div>
    <div id="blocks"></div>
    <div id="fx"></div>
  </div>
  <div id="next"></div>
  <div class="hint">Arraste os blocos e complete linhas. Blocos da <b>mesma cor lado a lado</b> valem muito mais pontos. A cada jogada sobe uma linha nova.</div>
</div>

<div id="overlay" class="hidden">
  <div class="card">
    <h2>Fim de jogo</h2>
    <div class="big" id="goScore">0</div>
    <div class="sub" id="goInfo">Fase 1 · 0 linhas</div>
    <div class="newbest" id="goBest" hidden>Novo recorde!</div>
    <input id="nome" maxlength="40" placeholder="Seu nome" autocomplete="nickname">
    <div id="saveStatus"></div>
    <div class="row">
      <button class="btn" id="btnSave">Salvar</button>
      <button class="btn primary" id="btnAgain">Jogar de novo</button>
    </div>
  </div>
</div>

<script>
(() => {
  const COLS = 8, ROWS = 10, LINES_PER_LEVEL = 8, START_ROWS = 4, N_COLORS = 4;
  const randColor = () => Math.floor(Math.random() * N_COLORS);
  const GAME_ID = 'deslize';
  const STATE_KEY = 'mg_deslize_state', BEST_KEY = 'mg_deslize_best', NAME_KEY = 'mg_nome';
  const hasGAS = typeof google !== 'undefined' && google.script && google.script.run;

  const $ = (id) => document.getElementById(id);
  const boardEl = $('board'), layer = $('blocks'), fx = $('fx'), lane = $('lane');
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };

  let blocks = [], nextRow = [], score = 0, level = 1, lines = 0;
  let busy = false, over = false, saved = false, idSeq = 0;
  let best = store.get(BEST_KEY, 0);
  const els = new Map();

  // ---------- regras ----------
  function makeGrid() {
    const g = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    for (const b of blocks) for (let i = 0; i < b.w; i++) g[b.row][b.col + i] = b;
    return g;
  }
  const isFree = (g, r, c, w) => { for (let i = 0; i < w; i++) if (g[r][c + i]) return false; return true; };

  function pickWidth(max) {
    const weight = [0, 3, 3, 2, 1.2];
    let tot = 0;
    for (let w = 1; w <= max; w++) tot += weight[w];
    let x = Math.random() * tot;
    for (let w = 1; w <= max; w++) { x -= weight[w]; if (x <= 0) return w; }
    return 1;
  }

  function genRow() {
    const dens = Math.min(0.78, 0.5 + (level - 1) * 0.035);
    for (let t = 0; t < 60; t++) {
      const row = []; let c = 0;
      while (c < COLS) {
        if (Math.random() < dens) { const w = pickWidth(Math.min(4, COLS - c)); row.push({ col: c, w, color: randColor() }); c += w; }
        else c++;
      }
      const filled = row.reduce((s, b) => s + b.w, 0);
      if (filled >= 3 && filled < COLS) return row;
    }
    return [{ col: 0, w: 2, color: randColor() }, { col: 3, w: 3, color: randColor() }, { col: 7, w: 1, color: randColor() }];
  }

  /**
   * Pontuação de uma linha cheia: agrupa células vizinhas da mesma cor.
   * Cada grupo de N células vale N² × 10 (1 célula = 10, 4 = 160, 8 = 640).
   * Linha inteira de uma cor só vale o dobro.
   */
  function scoreRow(g, r) {
    const groups = [];
    let c = 0;
    while (c < COLS) {
      const k = g[r][c].color;
      let e = c;
      while (e < COLS && g[r][e].color === k) e++;
      groups.push({ col: c, len: e - c, color: k, pts: (e - c) * (e - c) * 10 });
      c = e;
    }
    if (groups.length === 1) groups[0].pts *= 2;
    return groups;
  }

  function gravity() {
    const g = makeGrid(); let moved = false;
    for (const b of [...blocks].sort((a, z) => z.row - a.row)) {
      let r = b.row;
      while (r + 1 < ROWS && isFree(g, r + 1, b.col, b.w)) r++;
      if (r !== b.row) {
        for (let i = 0; i < b.w; i++) { g[b.row][b.col + i] = null; g[r][b.col + i] = b; }
        b.row = r; moved = true;
      }
    }
    return moved;
  }

  function fullRows() {
    const g = makeGrid(), rows = [];
    for (let r = 0; r < ROWS; r++) if (g[r].every(Boolean)) rows.push(r);
    return rows;
  }

  function canMoveAny() {
    const g = makeGrid();
    return blocks.some((b) => (b.col > 0 && !g[b.row][b.col - 1]) || (b.col + b.w < COLS && !g[b.row][b.col + b.w]));
  }

  function insertRow(animated) {
    for (const b of blocks) b.row--;
    for (const n of nextRow) blocks.push({ id: ++idSeq, row: ROWS - 1, col: n.col, w: n.w, color: n.color, enter: animated });
    nextRow = genRow();
  }

  // ---------- render ----------
  function render() {
    const alive = new Set();
    for (const b of blocks) {
      alive.add(b.id);
      let el = els.get(b.id);
      if (!el) {
        el = document.createElement('div');
        el.className = 'blk k' + b.color;
        el.dataset.id = b.id;
        el.innerHTML = '<div class="in"></div>';
        el.style.setProperty('--w', b.w);
        el.style.setProperty('--c', b.col);
        el.style.setProperty('--r', b.enter ? ROWS : b.row);
        layer.appendChild(el);
        els.set(b.id, el);
        if (b.enter) el.getBoundingClientRect(); // força layout para animar a entrada por baixo
        delete b.enter;
      }
      el.style.setProperty('--c', b.col);
      el.style.setProperty('--r', b.row);
    }
    for (const [id, el] of els) if (!alive.has(id)) { el.remove(); els.delete(id); }
    boardEl.classList.toggle('danger', blocks.some((b) => b.row <= 1));
    renderNext();
    updateHud();
  }

  function renderNext() {
    const nx = $('next');
    nx.innerHTML = '';
    for (const n of nextRow) {
      const d = document.createElement('div');
      d.className = 'bar k' + n.color;
      d.style.left = `calc(${(n.col / COLS) * 100}% + 3px)`;
      d.style.width = `calc(${(n.w / COLS) * 100}% - 6px)`;
      nx.appendChild(d);
    }
  }

  function updateHud() {
    $('score').textContent = score.toLocaleString('pt-BR');
    $('level').textContent = level;
    $('best').textContent = Math.max(best, score).toLocaleString('pt-BR');
    const p = lines % LINES_PER_LEVEL;
    $('progFill').style.width = (p / LINES_PER_LEVEL) * 100 + '%';
    $('progTxt').textContent = `${p} / ${LINES_PER_LEVEL} linhas para a fase ${level + 1}`;
  }

  function popup(text, row, col = 0, len = COLS) {
    const d = document.createElement('div');
    d.className = 'pop';
    d.textContent = text;
    d.style.top = `calc(var(--cell) * ${row + 0.2})`;
    d.style.left = `calc(var(--cell) * ${col})`;
    d.style.width = `calc(var(--cell) * ${len})`;
    if (len <= 1) d.style.fontSize = 'calc(var(--cell) * .36)';
    fx.appendChild(d);
    setTimeout(() => d.remove(), 950);
  }
  function banner(text) {
    fx.querySelectorAll('.banner').forEach((b) => b.remove());
    const d = document.createElement('div');
    d.className = 'banner';
    d.textContent = text;
    fx.appendChild(d);
    setTimeout(() => d.remove(), 1150);
  }

  // ---------- turno ----------
  async function resolve() {
    let combo = 0;
    for (;;) {
      if (gravity()) { render(); await sleep(210); }
      const rows = fullRows();
      if (!rows.length) break;
      combo++;
      const set = new Set(rows);
      for (const b of blocks) if (set.has(b.row)) els.get(b.id)?.classList.add('clearing');
      // multiplicador: fase × combo × bônus por várias linhas de uma vez
      const mult = level * combo * (rows.length > 1 ? 1.5 : 1);
      const g = makeGrid();
      let total = 0, mono = false;
      for (const r of rows) {
        const groups = scoreRow(g, r);
        if (groups.length === 1) mono = true;
        for (const gr of groups) {
          const p = Math.round(gr.pts * mult);
          total += p;
          popup('+' + p, r, gr.col, gr.len);
        }
      }
      score += total;
      lines += rows.length;
      if (mono) banner('Cor única! x2');
      else if (combo > 1) banner('Combo x' + combo);
      await sleep(300);
      blocks = blocks.filter((b) => !set.has(b.row));
      render();
      const newLevel = 1 + Math.floor(lines / LINES_PER_LEVEL);
      if (newLevel > level) { level = newLevel; setTimeout(() => banner('Fase ' + level + '!'), combo > 1 ? 700 : 0); }
    }
    if (combo && blocks.length === 0) {
      const bonus = 500 * level;
      score += bonus;
      banner('Limpou tudo! +' + bonus);
    }
    updateHud();
  }

  async function pushRow() {
    if (blocks.some((b) => b.row === 0)) { gameOver(); return; }
    insertRow(true);
    render();
    await sleep(230);
    await resolve();
  }

  async function turn() {
    busy = true;
    await resolve();
    if (!over) await pushRow();
    while (!over && !canMoveAny()) await pushRow();
    busy = false;
    if (!over) saveState();
  }

  // ---------- arrastar ----------
  let drag = null;
  function showLane(c, w) { lane.style.display = 'block'; lane.style.setProperty('--c', c); lane.style.setProperty('--w', w); }
  function hideLane() { lane.style.display = 'none'; }

  layer.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('.blk');
    if (!el || busy || over || drag) return;
    const b = blocks.find((x) => x.id === +el.dataset.id);
    if (!b) return;
    e.preventDefault();
    const g = makeGrid();
    let min = b.col, max = b.col;
    while (min > 0 && !g[b.row][min - 1]) min--;
    while (max + b.w < COLS && !g[b.row][max + b.w]) max++;
    if (min === max) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); return; }
    el.setPointerCapture(e.pointerId);
    drag = { b, el, x0: e.clientX, min, max, cell: boardEl.clientWidth / COLS, pos: b.col, target: b.col, pid: e.pointerId };
    el.classList.add('dragging');
    showLane(b.col, b.w);
  });

  layer.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.pid) return;
    const { b } = drag;
    const pos = Math.max(drag.min, Math.min(drag.max, b.col + (e.clientX - drag.x0) / drag.cell));
    drag.pos = pos;
    drag.target = Math.round(pos);
    drag.el.style.transform = `translateX(${(pos - b.col) * drag.cell}px)`;
    showLane(drag.target, b.w);
  });

  function endDrag(e) {
    if (!drag || e.pointerId !== drag.pid) return;
    const { b, el, pos, target, cell } = drag;
    drag = null;
    hideLane();
    const from = b.col;
    b.col = target;
    // encaixa suavemente na coluna final
    el.style.setProperty('--c', target);
    el.style.transform = `translateX(${(pos - target) * cell}px)`;
    el.getBoundingClientRect();
    el.classList.remove('dragging');
    el.style.transform = '';
    if (target !== from) turn();
  }
  layer.addEventListener('pointerup', endDrag);
  layer.addEventListener('pointercancel', endDrag);

  // ---------- estado / jogo ----------
  function saveState() {
    store.set(STATE_KEY, { blocks: blocks.map(({ id, row, col, w, color }) => ({ id, row, col, w, color })), nextRow, score, level, lines, idSeq });
  }

  function clearBoardEls() { for (const el of els.values()) el.remove(); els.clear(); fx.innerHTML = ''; }

  function withoutAnim(fn) {
    boardEl.classList.add('noanim');
    fn();
    boardEl.getBoundingClientRect();
    boardEl.classList.remove('noanim');
  }

  function newGame() {
    blocks = []; score = 0; level = 1; lines = 0; over = false; busy = false; saved = false;
    nextRow = genRow();
    for (let i = 0; i < START_ROWS; i++) {
      insertRow(false);
      gravity();
      const full = new Set(fullRows());
      blocks = blocks.filter((b) => !full.has(b.row));
    }
    clearBoardEls();
    withoutAnim(render);
    $('overlay').classList.add('hidden');
    saveState();
  }

  function loadGame() {
    const s = store.get(STATE_KEY, null);
    if (!s || !Array.isArray(s.blocks) || !s.blocks.length) return false;
    blocks = s.blocks; nextRow = s.nextRow || []; score = s.score;
    for (const b of [...blocks, ...nextRow]) if (b.color == null) b.color = randColor(); level = s.level; lines = s.lines; idSeq = s.idSeq || 1000;
    clearBoardEls();
    withoutAnim(render);
    return true;
  }

  function gameOver() {
    over = true; busy = false;
    store.del(STATE_KEY);
    const isBest = score > best;
    if (isBest) { best = score; store.set(BEST_KEY, best); }
    updateHud();
    $('goScore').textContent = score.toLocaleString('pt-BR');
    $('goInfo').textContent = `Fase ${level} · ${lines} linha${lines === 1 ? '' : 's'}`;
    $('goBest').hidden = !isBest;
    $('nome').value = store.get(NAME_KEY, '');
    $('btnSave').disabled = false;
    $('saveStatus').textContent = hasGAS ? '' : 'Modo local: sem conexão com a planilha.';
    setTimeout(() => {
      $('overlay').classList.remove('hidden');
      if (hasGAS && $('nome').value) saveScore(); // já tem nome: salva automático
    }, 500);
  }

  function saveScore() {
    if (saved) return;
    const nome = $('nome').value.trim();
    if (!nome) { $('saveStatus').textContent = 'Digite seu nome para salvar.'; $('nome').focus(); return; }
    store.set(NAME_KEY, nome);
    if (!hasGAS) { $('saveStatus').textContent = 'Modo local: sem conexão com a planilha.'; return; }
    $('btnSave').disabled = true;
    $('saveStatus').textContent = 'Salvando…';
    google.script.run
      .withSuccessHandler((r) => {
        saved = true;
        $('saveStatus').textContent = '✓ Salvo na planilha';
        if (r && r.recorde > best) { best = r.recorde; updateHud(); }
      })
      .withFailureHandler((err) => {
        $('btnSave').disabled = false;
        $('saveStatus').textContent = 'Erro ao salvar: ' + (err && err.message ? err.message : err);
      })
      .salvarScore({ jogo: GAME_ID, nome, pontos: score, fase: level, linhas: lines });
  }

  $('btnSave').addEventListener('click', saveScore);
  $('nome').addEventListener('keydown', (e) => { if (e.key === 'Enter') saveScore(); });
  $('btnAgain').addEventListener('click', newGame);
  $('btnRestart').addEventListener('click', () => { if (!busy && (over || confirm('Reiniciar a partida?'))) newGame(); });

  if (hasGAS) {
    google.script.run.withSuccessHandler((url) => {
      const a = $('btnMenu'); a.href = url; a.style.visibility = 'visible';
    }).getUrl();
    google.script.run.withSuccessHandler((rec) => {
      if (rec > best) { best = rec; updateHud(); }
    }).getRecorde(GAME_ID);
  }

  if (!loadGame()) newGame();
})();
</script>
</body>
</html>
